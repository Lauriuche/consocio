<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Principal - Magic Navigation</title>
    
    <!-- Configurações PWA e Integração do Manifesto -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#209cff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MagicMenu">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Google Fonts para tipografia limpa e moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- ESTILOS DE RESET E ESTRUTURA DA PÁGINA COMPLETA --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1d212b; /* Fundo base escuro correspondente ao vídeo */
            display: flex;
            flex-direction: column;
        }

        /* --- VISUALIZADOR DE PÁGINAS (IFRAME FULLSCREEN) --- */
        .content-wrapper {
            flex: 1;
            width: 100%;
            position: relative;
            background: #1d212b;
        }

        /* O iframe ocupa todo o espaço útil acima do menu */
        .main-frame {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: #1d212b;
        }

        /* --- BANNER FLUTUANTE DE INSTALAÇÃO PWA --- */
        .install-banner {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #209cff;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            display: none; /* Escondido por padrão, exibido dinamicamente via JS */
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            font-size: 0.85rem;
            font-weight: 500;
            width: calc(100% - 40px);
            max-width: 450px;
            animation: slideDown 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .install-banner button {
            background: #ffffff;
            color: #209cff;
            border: none;
            outline: none;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.8rem;
        }

        .install-banner button:hover {
            background: #f1f5f9;
            transform: scale(1.05);
        }

        @keyframes slideDown {
            from { top: -100px; opacity: 0; }
            to { top: 20px; opacity: 1; }
        }

        /* --- DOCK DE NAVEGAÇÃO INFERIOR COMPLETO (NAS BORDAS) --- */
        .bottom-dock {
            width: 100%;
            height: 85px; /* Altura ajustada para acomodar perfeitamente o balão flutuante */
            background: #1d212b; /* Fusão de cor com o fundo */
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Alinha a barra de navegação totalmente encostada ao fundo */
            position: relative;
            z-index: 100;
        }

        /* --- O MENU MÁGICO COMPLETO ENCOSTANDO NAS BORDAS --- */
        .navigation {
            width: 100%; /* Encosta a 100% nas bordas esquerda e direita */
            height: 70px; /* Altura exata da barra conforme o vídeo */
            background: #209cff; /* Azul clássico do vídeo */
            position: relative;
            display: flex;
            justify-content: center; /* Centraliza os itens internamente em ecrãs muito largos */
            align-items: center;
            z-index: 1;
            border-radius: 0; /* Remove os cantos arredondados externos para colar nas bordas */
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.15);
        }

        .navigation ul {
            position: relative;
            display: flex;
            width: 100%; /* Distribuição fluida em toda a largura */
            max-width: 600px; /* Limite de largura elegante em monitores grandes para não dispersar os ícones */
            padding: 0;
            margin: 0;
        }

        .navigation ul li {
            position: relative;
            list-style: none;
            flex: 1; /* Distribui os 5 elementos de forma perfeitamente idêntica (20% de largura cada) */
            height: 70px;
            z-index: 1;
        }

        .navigation ul li a {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 100%;
            height: 100%;
            text-align: center;
            text-decoration: none;
        }

        .navigation ul li a .icon {
            position: relative;
            display: block;
            line-height: 75px;
            font-size: 1.55em;
            text-align: center;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #ffffff; /* Ícones inativos em branco */
        }

        /* Transição de subida do ícone ativo */
        .navigation ul li.active a .icon {
            transform: translateY(-32px);
            color: #209cff; /* Cor ativa correspondente à barra */
        }

        /* --- O INDICADOR CIRCULAR (BALÃO BRANCO FLUIDO) --- */
        .indicator {
            position: absolute;
            top: -35px; /* Metade projetada para fora da barra */
            width: 70px;
            height: 70px;
            background: #ffffff;
            border-radius: 50%;
            border: 6px solid #1d212b; /* Contorno exato que simula o corte sobre o fundo */
            z-index: 2;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            pointer-events: none;
            left: 0;
        }

        /* Garante que o ícone ativo se sobreponha ao indicador */
        .navigation ul li.active {
            z-index: 10;
        }

        /* --- POSICIONAMENTO DINÂMICO BASEADO EM PERCENTAGEM --- */
        .navigation ul li:nth-child(1).active ~ .indicator { left: calc(10% - 35px); }
        .navigation ul li:nth-child(2).active ~ .indicator { left: calc(30% - 35px); }
        .navigation ul li:nth-child(3).active ~ .indicator { left: calc(50% - 35px); }
        .navigation ul li:nth-child(4).active ~ .indicator { left: calc(70% - 35px); }
        .navigation ul li:nth-child(5).active ~ .indicator { left: calc(90% - 35px); }
    </style>
</head>
<body>

    <!-- Banner personalizado para ativação da instalação PWA -->
    <div id="pwaInstallBanner" class="install-banner">
        <span>Instalar a aplicação para usar offline?</span>
        <button id="pwaInstallBtn">Instalar</button>
    </div>

    <!-- 1. ÁREA CENTRAL DE CONTEÚDO (Páginas do seu site) -->
    <div class="content-wrapper">
        <!-- 
          O iframe aponta diretamente para "cdb.html" por padrão,
          fazendo com que a primeira página carregue automaticamente ao iniciar de forma instantânea.
        -->
        <iframe 
            name="content-frame" 
            id="mainFrame"
            class="main-frame" 
            src="cdb.html">
        </iframe>
    </div>

    <!-- 2. DOCK INFERIOR (NAS BORDAS DA TELA) -->
    <div class="bottom-dock">
        <div class="navigation">
            <ul>
                <!-- Link 1: Investimento (CDB) -->
                <li class="list active" data-url="cdb.html">
                    <a href="cdb.html" target="content-frame">
                        <span class="icon">
                            <ion-icon name="trending-up-outline"></ion-icon>
                        </span>
                    </a>
                </li>
                <!-- Link 2: Consórcio (Grupo/Associação) -->
                <li class="list" data-url="consocio.html">
                    <a href="consocio.html" target="content-frame">
                        <span class="icon">
                            <ion-icon name="people-outline"></ion-icon>
                        </span>
                    </a>
                </li>
                <!-- Link 3: Chat / Mensagens -->
                <li class="list" data-url="chat.html">
                    <a href="chat.html" target="content-frame">
                        <span class="icon">
                            <ion-icon name="chatbubble-outline"></ion-icon>
                        </span>
                    </a>
                </li>
                <!-- Link 4: Câmara / Galeria -->
                <li class="list" data-url="camera.html">
                    <a href="camera.html" target="content-frame">
                        <span class="icon">
                            <ion-icon name="camera-outline"></ion-icon>
                        </span>
                    </a>
                </li>
                <!-- Link 5: Definições -->
                <li class="list" data-url="settings.html">
                    <a href="settings.html" target="content-frame">
                        <span class="icon">
                            <ion-icon name="settings-outline"></ion-icon>
                        </span>
                    </a>
                </li>
                <!-- O Balão Indicador Branco que desliza fluidamente -->
                <div class="indicator"></div>
            </ul>
        </div>
    </div>

    <!-- Scripts do Ionicons para renderizar os ícones do vídeo -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <!-- Script de Animação, Sincronização de Páginas e Registo do PWA -->
    <script>
        const listItems = document.querySelectorAll('.list');
        const frame = document.getElementById('mainFrame');

        // 1. GESTÃO DOS CLIQUES NO MENU (Instantâneo)
        function handleMenuNavigation(e) {
            listItems.forEach((item) => item.classList.remove('active'));
            this.classList.add('active');
        }

        listItems.forEach((item) => {
            item.addEventListener('click', handleMenuNavigation);
            item.addEventListener('touchstart', handleMenuNavigation, { passive: true });
        });

        // 2. LOGICA INTELIGENTE DE INSTALAÇÃO DA PWA (beforeinstallprompt)
        let deferredPrompt;
        const installBanner = document.getElementById('pwaInstallBanner');
        const installBtn = document.getElementById('pwaInstallBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Previne que o prompt padrão do Chrome apareça sem controlo
            e.preventDefault();
            // Guarda o evento para ser acionado sob o clique do utilizador
            deferredPrompt = e;
            // Revela o banner de instalação personalizado de forma elegante
            if (installBanner) {
                installBanner.style.display = 'flex';
            }
        });

        if (installBtn) {
            installBtn.addEventListener('click', async () => {
                if (!deferredPrompt) return;
                // Exibe o prompt oficial de instalação do sistema operativo
                deferredPrompt.prompt();
                // Aguarda pela resposta final de confirmação do utilizador
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`Resposta do utilizador ao prompt de instalação: ${outcome}`);
                // Reset da variável
                deferredPrompt = null;
                // Oculta o banner de convite
                if (installBanner) {
                    installBanner.style.display = 'none';
                }
            });
        }

        // Esconde o banner caso a instalação seja concluída com sucesso
        window.addEventListener('appinstalled', (evt) => {
            console.log('Aplicação PWA instalada com sucesso!');
            if (installBanner) {
                installBanner.style.display = 'none';
            }
        });

        // 3. REGISTO DO SERVICE WORKER SEGURO
        // Validamos se o navegador suporta e se o protocolo web é estritamente HTTP ou HTTPS (previne erros em Sandboxes locais)
        const isSupportedProtocol = window.location.protocol === 'http:' || window.location.protocol === 'https:';
        
        if ('serviceWorker' in navigator && isSupportedProtocol) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('Service Worker registado com sucesso sob o escopo: ', registration.scope);
                    })
                    .catch((error) => {
                        console.error('Falha ao registar o Service Worker: ', error);
                    });
            });
        } else {
            console.log('Registo do Service Worker ignorado neste ambiente (não suporta HTTPS/HTTP padrão).');
        }
    </script>
</body>
</html>
