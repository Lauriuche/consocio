<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Principal - Magic Navigation</title>
    
    <!-- Configurações PWA e Integração do Manifesto -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#209cff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MagicMenu">
    
    <!-- Ícone alternativo para dispositivos Apple embutido via SVG de forma direta -->
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='40' fill='%23209cff'/><text x='96' y='125' font-family='Arial, sans-serif' font-weight='bold' font-size='100' fill='%23ffffff' text-anchor='middle'>M</text></svg>">

    <!-- Google Fonts para tipografia limpa e moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- ESTILOS DE RESET E ESTRUTURA DA PÁGINA COMPLETA --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1d212b; /* Fundo base escuro correspondente ao vídeo */
            display: flex;
            flex-direction: column;
        }

        /* --- VISUALIZADOR DE PÁGINAS (IFRAME FULLSCREEN) --- */
        .content-wrapper {
            flex: 1;
            width: 100%;
            position: relative;
            background: #1d212b;
        }

        /* O iframe ocupa todo o espaço útil acima do menu */
        .main-frame {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: #1d212b;
        }

        /* */
        /* --- BANNER FLUTUANTE DE INSTALAÇÃO PWA --- */
        .install-banner {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #209cff;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            display: none; /* Exibido dinamicamente via JS se a PWA for elegível */
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            font-size: 0.85rem;
            font-weight: 500;
            width: calc(100% - 40px);
            max-width: 450px;
            animation: slideDown 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .install-banner-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .install-banner button#pwaInstallBtn {
            background: #ffffff;
            color: #209cff;
            border: none;
            outline: none;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.8rem;
        }

        .install-banner button#pwaInstallBtn:hover {
            background: #f1f5f9;
            transform: scale(1.05);
        }

        .install-banner button#pwaDismissBtn {
            background: transparent;
            color: rgba(255, 255, 255, 0.8);
            border: none;
            outline: none;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s ease;
        }

        .install-banner button#pwaDismissBtn:hover {
            color: #ffffff;
        }

        @keyframes slideDown {
            from { top: -100px; opacity: 0; }
            to { top: 20px; opacity: 1; }
        }

        /* */
        /* --- DOCK DE NAVEGAÇÃO INFERIOR COMPLETO (NAS BORDAS) --- */
        .bottom-dock {
            width: 100%;
            height: 85px; /* Altura ajustada para acomodar perfeitamente o balão flutuante */
            background: #1d212b; /* Fusão de cor com o fundo */
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Alinha a barra de navegação totalmente encostada ao fundo */
            position: relative;
            z-index: 100;
        }

        /* --- O MENU MÁGICO COMPLETO ENCOSTANDO NAS BORDAS --- */
        .navigation {
            width: 100%; /* Encosta a 100% nas bordas esquerda e direita */
            height: 70px; /* Altura exata da barra conforme o vídeo */
            background: #209cff; /* Azul clássico do vídeo */
            position: relative;
            display: flex;
            justify-content: center; /* Centraliza os itens internamente em ecrãs muito largos */
            align-items: center;
            z-index: 1;
            border-radius: 0; /* Remove os cantos arredondados externos para colar nas bordas */
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.15);
        }

        .navigation ul {
            position: relative;
            display: flex;
            width: 100%; /* Distribuição fluida em toda a largura */
            max-width: 600px; /* Limite de largura elegante em monitores grandes para não dispersar os ícones */
            padding: 0;
            margin: 0;
            /* Define este elemento como container para podermos medir a sua largura em tempo real (cqw) */
            container-type: inline-size;
        }

        .navigation ul li {
            position: relative;
            list-style: none;
            flex: 1; /* Distribui os 5 elementos de forma perfeitamente idêntica (20% de largura cada) */
            height: 70px;
            z-index: 1;
        }

        .navigation ul li a {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 100%;
            height: 100%;
            text-align: center;
            text-decoration: none;
        }

        /* */
        .navigation ul li a .icon {
            position: relative;
            display: block;
            line-height: 75px;
            font-size: 1.55em;
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #ffffff; /* Ícones inativos em branco */
            will-change: transform; /* Força o navegador a criar uma camada dedicada na GPU */
        }

        /* Transição de subida do ícone ativo super suave na GPU */
        .navigation ul li.active a .icon {
            transform: translate3d(0, -32px, 0);
            color: #209cff; /* Cor ativa correspondente à barra */
        }

        /* --- O INDICADOR CIRCULAR (BALÃO BRANCO FLUIDO COM GPU) --- */
        .indicator {
            position: absolute;
            top: -35px; /* Metade projetada para fora da barra */
            width: 70px;
            height: 70px;
            background: #ffffff;
            border-radius: 50%;
            border: 6px solid #1d212b; /* Contorno exato que simula o corte sobre o fundo */
            z-index: 2;
            /* Transição de transform acelerada por hardware (Sem lag ou travamentos) */
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            pointer-events: none;
            left: 0;
            will-change: transform; /* Otimização máxima para renderização ultra rápida */
        }

        /* Garante que o ícone ativo se sobreponha ao indicador */
        .navigation ul li.active {
            z-index: 10;
        }

        /* 
           --- POSICIONAMENTO BASEADO EM CONTAINER QUERIES (cqw) ---
           Calculamos dinamicamente com base na largura real do container 'ul':
           - Item 1 (Centro a 10% da largura do container): 10cqw
           - Item 2 (Centro a 30% da largura do container): 30cqw
           - Item 3 (Centro a 50% da largura do container): 50cqw
           - Item 4 (Centro a 70% da largura do container): 70cqw
           - Item 5 (Centro a 90% da largura do container): 90cqw
           Subtraímos 35px para centralizar perfeitamente o círculo de 70px de diâmetro.
        */
        .navigation ul li:nth-child(1).active ~ .indicator { transform: translate3d(calc(10cqw - 35px), 0, 0); }
        .navigation ul li:nth-child(2).active ~ .indicator { transform: translate3d(calc(30cqw - 35px), 0, 0); }
        .navigation ul li:nth-child(3).active ~ .indicator { transform: translate3d(calc(50cqw - 35px), 0, 0); }
        .navigation ul li:nth-child(4).active ~ .indicator { transform: translate3d(calc(70cqw - 35px), 0, 0); }
        .navigation ul li:nth-child(5).active ~ .indicator { transform: translate3d(calc(90cqw - 35px), 0, 0); }
    </style>
</head>
<body>

    <!-- Banner personalizado para ativação da instalação PWA -->
    <div id="pwaInstallBanner" class="install-banner">
        <span>Instalar a aplicação para usar offline?</span>
        <div class="install-banner-actions">
            <button id="pwaInstallBtn">Instalar</button>
            <button id="pwaDismissBtn" title="Fechar">&times;</button>
        </div>
    </div>

    <!-- 1. ÁREA CENTRAL DE CONTEÚDO (Páginas do seu site) -->
    <div class="content-wrapper">
        <iframe 
            name="content-frame" 
            id="mainFrame"
            class="main-frame" 
            src="consocio.html">
        </iframe>
    </div>

    <!-- 2. DOCK INFERIOR (NAS BORDAS DA TELA) -->
    <div class="bottom-dock">
        <div class="navigation">
            <ul>
                <!-- Link 1: Investimento (CDB) -->
                <li class="list" data-url="cdb.html">
                    <a href="cdb.html" target="content-frame">
                        <span class="icon">
                            <ion-icon name="trending-up-outline"></ion-icon>
                        </span>
                    </a>
                </li>
                <!-- Link 2: Consórcio -->
                <li class="list active" data-url="consocio.html">
                    <a href="consocio.html" target="content-frame">
                        <span class="icon">
                            <ion-icon name="people-outline"></ion-icon>
                        </span>
                    </a>
                </li>
                <!-- Link 3: Chat / Mensagens -->
                <li class="list" data-url="https://lauriuche.github.io/cartao/">
                    <a href="https://lauriuche.github.io/cartao/" target="content-frame">
                        <span class="icon">
                            <ion-icon name="chatbubble-outline"></ion-icon>
                        </span>
                    </a>
                </li>
                <!-- Link 4: Câmara / Galeria -->
                <li class="list" data-url="manutenção.html">
                    <a href="manutenção.html" target="content-frame">
                        <span class="icon">
                            <ion-icon name="camera-outline"></ion-icon>
                        </span>
                    </a>
                </li>
                <!-- Link 5: Definições -->
                <li class="list" data-url="manutenção.html">
                    <a href="manutenção.html" target="content-frame">
                        <span class="icon">
                            <ion-icon name="settings-outline"></ion-icon>
                        </span>
                    </a>
                </li>
                <!-- O Balão Indicador Branco que desliza fluidamente -->
                <div class="indicator"></div>
            </ul>
        </div>
    </div>

    <!-- Scripts do Ionicons para renderizar os ícones do vídeo -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <!-- -->
    <!-- Script de Animação, Sincronização de Páginas e Registo do PWA -->
    <script>
        const listItems = document.querySelectorAll('.list');
        const frame = document.getElementById('mainFrame');

        // 1. GESTÃO DOS CLIQUES NO MENU
        function handleMenuNavigation(e) {
            listItems.forEach((item) => item.classList.remove('active'));
            this.classList.add('active');
        }

        listItems.forEach((item) => {
            item.addEventListener('click', handleMenuNavigation);
            item.addEventListener('touchstart', handleMenuNavigation, { passive: true });
        });

        // 2. LOGICA INTELIGENTE DE INSTALAÇÃO DA PWA (beforeinstallprompt)
        let deferredPrompt;
        const installBanner = document.getElementById('pwaInstallBanner');
        const installBtn = document.getElementById('pwaInstallBtn');
        const dismissBtn = document.getElementById('pwaDismissBtn');

        // Verifica de imediato se o utilizador já tem a aplicação aberta em modo autónomo (Standalone/App)
        const isStandaloneMode = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        
        // Verifica se o utilizador já concluiu a instalação no passado (pela flag local) ou se recusou recentemente
        const isAlreadyInstalled = localStorage.getItem('pwaInstalled') === 'true';
        const isPermanentlyDismissed = localStorage.getItem('pwaDismissed') === 'true';

        window.addEventListener('beforeinstallprompt', (e) => {
            // Se já estiver instalado ou se estiver a correr no modo app, nunca exibe o banner
            if (isStandaloneMode || isAlreadyInstalled || isPermanentlyDismissed) {
                return;
            }

            e.preventDefault();
            deferredPrompt = e;
            
            if (installBanner) {
                installBanner.style.display = 'flex';
            }
        });

        if (installBtn) {
            installBtn.addEventListener('click', async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`Escolha de instalação: ${outcome}`);
                
                if (outcome === 'accepted') {
                    localStorage.setItem('pwaInstalled', 'true');
                }
                
                deferredPrompt = null;
                if (installBanner) {
                    installBanner.style.display = 'none';
                }
            });
        }

        // Lógica de descarte permanente (Fechar o banner)
        if (dismissBtn) {
            dismissBtn.addEventListener('click', () => {
                localStorage.setItem('pwaDismissed', 'true');
                if (installBanner) {
                    installBanner.style.display = 'none';
                }
            });
        }

        window.addEventListener('appinstalled', (evt) => {
            console.log('Aplicação instalada com sucesso no sistema!');
            localStorage.setItem('pwaInstalled', 'true');
            if (installBanner) {
                installBanner.style.display = 'none';
            }
        });

        // 3. REGISTO DO SERVICE WORKER SEGURO
        const isSupportedProtocol = window.location.protocol === 'http:' || window.location.protocol === 'https:';
        
        if ('serviceWorker' in navigator && isSupportedProtocol) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('Service Worker registado com sucesso sob o escopo: ', registration.scope);
                    })
                    .catch((error) => {
                        console.error('Falha ao registar o Service Worker: ', error);
                    });
            });
        } else {
            console.log('Ambiente ou protocolo não suportado para instalação PWA.');
        }
    </script>
</body>
</html>
