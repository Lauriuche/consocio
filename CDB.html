<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulador CDB • Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        .app-input {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .dark .app-input {
            background-color: #1e2937;
            border-color: #334155;
        }
        .app-input:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 min-h-screen">

<div class="max-w-md mx-auto min-h-screen bg-white dark:bg-slate-900 shadow-2xl overflow-hidden">

    <!-- Header -->
    <div class="bg-gradient-to-br from-slate-900 to-slate-800 dark:from-black dark:to-slate-900 text-white p-7 rounded-b-3xl">
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-emerald-500 rounded-2xl flex items-center justify-center">
                    <i class="fas fa-chart-line text-2xl"></i>
                </div>
                <span class="font-bold text-2xl tracking-tighter">CDB Pro</span>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleDarkMode()" class="w-10 h-10 flex items-center justify-center rounded-2xl hover:bg-white/10">
                    <i id="themeIcon" class="fas fa-moon text-xl"></i>
                </button>
                <button onclick="resetAll()" class="w-10 h-10 flex items-center justify-center rounded-2xl hover:bg-white/10">
                    <i class="fas fa-eraser text-xl"></i>
                </button>
            </div>
        </div>

        <div class="text-center">
            <p class="text-emerald-400 text-xs tracking-widest uppercase">Resultado Estimado</p>
            <h1 id="headerResult" class="text-6xl font-bold text-emerald-400 tracking-tighter">R$ 0,00</h1>
            <p id="headerProfit" class="text-emerald-300 text-lg">+ R$ 0,00 de lucro</p>
        </div>
    </div>

    <div class="p-6 space-y-8">

        <!-- Valores -->
        <div class="bg-white dark:bg-slate-800 rounded-3xl shadow p-6">
            <h3 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-4 flex items-center gap-2">
                <i class="fas fa-coins"></i> VALORES
            </h3>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-xs font-medium text-slate-500 dark:text-slate-400">Inicial</label>
                    <div class="relative">
                        <span class="absolute left-4 top-4 text-slate-400">R$</span>
                        <input type="text" id="investmentValue" inputmode="numeric" 
                               class="app-input w-full pl-10 pr-4 py-4 text-xl font-semibold dark:text-white"
                               placeholder="10.000,00" oninput="formatCurrency(this); debounceCalculate()">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-medium text-slate-500 dark:text-slate-400">Mensal</label>
                    <div class="relative">
                        <span class="absolute left-4 top-4 text-slate-400">R$</span>
                        <input type="text" id="monthlyValue" inputmode="numeric"
                               class="app-input w-full pl-10 pr-4 py-4 text-xl font-semibold dark:text-white"
                               placeholder="500,00" oninput="formatCurrency(this); debounceCalculate()">
                    </div>
                </div>
            </div>
        </div>

        <!-- Taxas -->
        <div class="bg-white dark:bg-slate-800 rounded-3xl shadow p-6">
            <h3 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase mb-4 flex items-center gap-2">
                <i class="fas fa-percent"></i> TAXAS
            </h3>
            <div class="bg-emerald-50 dark:bg-emerald-950/50 rounded-3xl p-5 mb-5">
                <div class="flex justify-between items-center">
                    <div>
                        <label class="text-xs font-medium text-emerald-700 dark:text-emerald-400">CDI Atual</label>
                        <input type="text" id="cdiRate" readonly class="bg-transparent text-3xl font-bold w-full dark:text-white">
                    </div>
                    <button onclick="fetchCDI()" class="w-11 h-11 bg-white dark:bg-slate-700 rounded-2xl shadow hover:scale-110 transition-all">
                        <i class="fas fa-sync-alt text-emerald-600" id="refreshIcon"></i>
                    </button>
                </div>
            </div>

            <div>
                <label class="text-xs font-medium text-slate-500 dark:text-slate-400 mb-2">Rentabilidade (% do CDI)</label>
                <div class="relative">
                    <input type="text" id="cdbPercent" value="100" inputmode="decimal"
                           class="app-input w-full text-center font-bold text-3xl py-6 dark:text-white"
                           oninput="debounceCalculate()">
                    <span class="absolute right-6 top-1/2 -translate-y-1/2 text-3xl text-slate-400">%</span>
                </div>
            </div>
        </div>

        <!-- Prazo -->
        <div class="bg-white dark:bg-slate-800 rounded-3xl shadow p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase flex items-center gap-2">
                    <i class="fas fa-calendar-alt"></i> PRAZO
                </h3>
                <label class="flex items-center gap-2 cursor-pointer select-none">
                    <span id="modeLabel" class="text-sm font-medium">Dias Úteis</span>
                    <div class="toggle-switch">
                        <input type="checkbox" id="useBusinessDays" checked onchange="toggleMode()">
                        <span class="toggle-slider bg-slate-300 dark:bg-slate-600"></span>
                    </div>
                </label>
            </div>

            <div class="grid grid-cols-3 gap-4">
                <div>
                    <label class="text-xs text-slate-500 dark:text-slate-400">Meses</label>
                    <input type="number" id="monthsInput" class="app-input w-full py-4 text-center text-xl font-semibold dark:text-white" oninput="handleMonthsChange()">
                </div>
                <div class="col-span-2">
                    <label class="text-xs text-slate-500 dark:text-slate-400">Dias <span id="daysLabelType" class="text-emerald-600">(Úteis)</span></label>
                    <input type="number" id="daysInput" class="app-input w-full py-4 text-center text-xl font-semibold dark:text-white" oninput="debounceCalculate()">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mt-6">
                <div>
                    <label class="text-xs text-slate-500 dark:text-slate-400">Início</label>
                    <input type="date" id="startDate" class="app-input w-full py-4 dark:text-white" onchange="handleDateChange()">
                </div>
                <div>
                    <label class="text-xs text-slate-500 dark:text-slate-400">Fim</label>
                    <input type="date" id="endDate" class="app-input w-full py-4 dark:text-white" onchange="handleDateChange()">
                </div>
            </div>
        </div>

        <button onclick="calculate()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 py-6 rounded-3xl text-white font-semibold text-lg shadow-xl active:scale-95 transition-all flex items-center justify-center gap-3">
            <i class="fas fa-calculator"></i> CALCULAR
        </button>

        <!-- Resultado -->
        <div id="detailsSection" class="hidden bg-white dark:bg-slate-800 rounded-3xl shadow p-6 mt-4">
            <h4 class="font-semibold text-lg mb-6">Resultado Detalhado</h4>
            <div class="h-60 mb-8">
                <canvas id="resultChart"></canvas>
            </div>

            <div class="space-y-4">
                <div class="flex justify-between"><span class="text-slate-500 dark:text-slate-400">Total Investido</span><span id="detTotalInvested" class="font-semibold">R$ 0,00</span></div>
                <div class="flex justify-between"><span class="text-slate-500 dark:text-slate-400">Bruto Final</span><span id="detTotalGross" class="font-semibold">R$ 0,00</span></div>
                <div class="flex justify-between"><span class="text-slate-500 dark:text-slate-400">IOF</span><span id="detTotalIOF" class="text-orange-600">- R$ 0,00</span></div>
                <div class="flex justify-between"><span class="text-slate-500 dark:text-slate-400">IR</span><span id="detTotalTax" class="text-red-600">- R$ 0,00</span></div>
                <div class="flex justify-between border-t pt-4 font-bold text-lg">
                    <span>Líquido Final</span>
                    <span id="detTotalNet" class="text-emerald-500">R$ 0,00</span>
                </div>
            </div>

            <!-- Estimativa de Rendimento -->
            <div class="mt-8 bg-emerald-50 dark:bg-emerald-950/30 p-5 rounded-3xl">
                <h5 class="font-semibold text-emerald-700 dark:text-emerald-400 mb-4">Estimativa de Rendimento</h5>
                <div class="grid grid-cols-2 gap-4 text-center">
                    <div><div class="text-xs text-slate-500">DIÁRIO</div><div id="yieldDaily" class="font-bold">R$ 0,00</div></div>
                    <div><div class="text-xs text-slate-500">MENSAL</div><div id="yieldMonthly" class="font-bold">R$ 0,00</div></div>
                    <div><div class="text-xs text-slate-500">ANUAL</div><div id="yieldYearly" class="font-bold">R$ 0,00</div></div>
                    <div><div class="text-xs text-slate-500">TOTAL</div><div id="yieldTotal" class="font-bold text-emerald-600">R$ 0,00</div></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let resultChart = null;
    let debounceTimer = null;

    // Supressão do warning do Tailwind
    console.warn = () => {};

    function formatCurrency(input) {
        let val = input.value.replace(/\D/g, '');
        if (!val) { input.value = ''; return; }
        input.value = (parseInt(val)/100).toLocaleString('pt-BR', {minimumFractionDigits: 2});
    }

    function parseMoney(str) {
        if (!str) return 0;
        return parseFloat(str.replace(/\./g,'').replace(',','.')) || 0;
    }

    function formatBRL(v) {
        return v.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
    }

    async function fetchCDI() {
        try {
            const res = await fetch('https://api.bcb.gov.br/dados/serie/bcdata.sgs.12/dados/ultimos/1?formato=json');
            const data = await res.json();
            const daily = parseFloat(data[0].valor);
            const annual = (Math.pow(1 + daily/100, 252) - 1) * 100;
            document.getElementById('cdiRate').value = annual.toFixed(2);
        } catch(e) {
            document.getElementById('cdiRate').value = '14.40';
        }
    }

    function calculateDateBreakdown(start, end) {
        let current = new Date(start);
        const endDate = new Date(end);
        let total = 0, business = 0, weekend = 0, holiday = 0;
        while (current <= endDate) {
            total++;
            const d = current.getDay();
            if (d === 0 || d === 6) weekend++;
            else if ({'01-01':1,'04-21':1,'05-01':1,'09-07':1,'10-12':1,'11-02':1,'11-15':1,'12-25':1}[current.toISOString().slice(5,10)]) holiday++;
            else business++;
            current.setDate(current.getDate() + 1);
        }
        return { totalDays: total - 1, businessDays: business, weekends: weekend, holidays: holiday };
    }

    function handleMonthsChange() {
        const months = parseInt(document.getElementById('monthsInput').value) || 0;
        const startStr = document.getElementById('startDate').value;
        if (months > 0 && startStr) {
            let end = new Date(startStr);
            end.setMonth(end.getMonth() + months);
            document.getElementById('endDate').valueAsDate = end;
        }
        debounceCalculate();
    }

    function handleDateChange() {
        debounceCalculate();
    }

    function toggleMode() {
        const checked = document.getElementById('useBusinessDays').checked;
        document.getElementById('modeLabel').textContent = checked ? "Dias Úteis" : "Dias Corridos";
        document.getElementById('daysLabelType').textContent = checked ? "(Úteis)" : "(Corridos)";
        debounceCalculate();
    }

    function toggleDarkMode() {
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('darkMode', document.documentElement.classList.contains('dark'));
        updateThemeIcon();
    }

    function updateThemeIcon() {
        const icon = document.getElementById('themeIcon');
        icon.classList.toggle('fa-moon', !document.documentElement.classList.contains('dark'));
        icon.classList.toggle('fa-sun', document.documentElement.classList.contains('dark'));
    }

    function debounceCalculate() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(calculate, 400);
    }

    function calculate() {
        const principal = parseMoney(document.getElementById('investmentValue').value) || 0;
        if (principal <= 0) return;

        const monthly = parseMoney(document.getElementById('monthlyValue').value);
        const cdi = parseFloat(document.getElementById('cdiRate').value) || 14.4;
        const percent = parseFloat(document.getElementById('cdbPercent').value) || 100;
        const useBusiness = document.getElementById('useBusinessDays').checked;

        const startStr = document.getElementById('startDate').value;
        const endStr = document.getElementById('endDate').value;

        if (!startStr || !endStr) return;

        const start = new Date(startStr);
        const end = new Date(endStr);
        if (end <= start) return;

        const breakdown = calculateDateBreakdown(start, end);
        const daysRate = useBusiness ? breakdown.businessDays : breakdown.totalDays;
        const daysTax = breakdown.totalDays;

        const dailyCDB = (Math.pow(1 + cdi/100, 1/252) - 1) * (percent / 100);

        let gross = principal * Math.pow(1 + dailyCDB, daysRate);
        let profit = gross - principal;

        let iof = 0;
        if (daysTax < 30 && daysTax > 0) {
            const iofTable = [96,93,90,86,83,80,76,73,70,66,63,60,56,53,50,46,43,40,36,33,30,26,23,20,16,13,10,6,3];
            iof = profit * (iofTable[daysTax-1] / 100);
        }

        const irRate = daysTax <= 180 ? 22.5 : daysTax <= 360 ? 20 : daysTax <= 720 ? 17.5 : 15;
        const ir = (profit - iof) * (irRate / 100);

        let totalInvested = principal;
        let totalGross = gross;
        let totalIOF = iof;
        let totalIR = ir;

        if (monthly > 0) {
            let current = new Date(start); current.setMonth(current.getMonth() + 1);
            while (current < end) {
                const mBD = calculateDateBreakdown(current, end);
                const mDays = useBusiness ? mBD.businessDays : mBD.totalDays;
                const mGross = monthly * Math.pow(1 + dailyCDB, mDays);
                totalInvested += monthly;
                totalGross += mGross;
                totalIR += (mGross - monthly) * (irRate / 100);
                current.setMonth(current.getMonth() + 1);
            }
        }

        const totalNet = totalGross - totalIOF - totalIR;
        const netProfit = totalNet - totalInvested;

        // Atualiza tela
        document.getElementById('headerResult').textContent = formatBRL(totalNet);
        document.getElementById('headerProfit').textContent = `+ ${formatBRL(netProfit)} de lucro`;

        document.getElementById('detTotalInvested').textContent = formatBRL(totalInvested);
        document.getElementById('detTotalGross').textContent = formatBRL(totalGross);
        document.getElementById('detTotalIOF').textContent = `- ${formatBRL(totalIOF)}`;
        document.getElementById('detTotalTax').textContent = `- ${formatBRL(totalIR)}`;
        document.getElementById('detTotalNet').textContent = formatBRL(totalNet);

        // Estimativa
        const totalDays = breakdown.totalDays || 1;
        document.getElementById('yieldDaily').textContent = formatBRL(netProfit / totalDays);
        document.getElementById('yieldMonthly').textContent = formatBRL(netProfit / (totalDays / 30));
        document.getElementById('yieldYearly').textContent = formatBRL(netProfit * (365 / totalDays));
        document.getElementById('yieldTotal').textContent = formatBRL(netProfit);

        document.getElementById('detailsSection').classList.remove('hidden');

        // Gráfico
        if (resultChart) resultChart.destroy();
        resultChart = new Chart(document.getElementById('resultChart'), {
            type: 'doughnut',
            data: {
                labels: ['Investido', 'Lucro', 'Impostos'],
                datasets: [{ data: [totalInvested, netProfit, totalIOF + totalIR], backgroundColor: ['#64748b', '#10b981', '#ef4444'] }]
            },
            options: { responsive: true, maintainAspectRatio: false, cutout: '78%' }
        });
    }

    function resetAll() { location.reload(); }

    window.onload = () => {
        if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark');
        updateThemeIcon();

        const today = new Date();
        document.getElementById('startDate').valueAsDate = today;
        const end = new Date(today); end.setMonth(end.getMonth() + 12);
        document.getElementById('endDate').valueAsDate = end;

        fetchCDI();
    };
</script>
</body>
</html>
