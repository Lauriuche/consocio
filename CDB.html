<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulador CDB • Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F1F5F9; }
        
        .app-input {
            background-color: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.2s;
        }
        .app-input:focus {
            background-color: #FFFFFF;
            border-color: #10B981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
            outline: none;
        }

        /* Toggle Switch Melhorado */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 28px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #CBD5E1;
            transition: .4s;
            border-radius: 9999px;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .toggle-slider {
            background-color: #10B981;
        }
        input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }

        .details-enter {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.4s ease;
        }
        .details-enter.active {
            max-height: 1600px;
            opacity: 1;
        }
    </style>
</head>
<body class="text-slate-800">

<div class="max-w-md mx-auto min-h-screen bg-white shadow-2xl overflow-hidden relative pb-20">

    <!-- Header -->
    <div class="bg-slate-900 text-white p-6 rounded-b-3xl">
        <div class="flex justify-between items-center mb-4">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-emerald-500 rounded-2xl flex items-center justify-center">
                    <i class="fas fa-chart-line text-white text-xl"></i>
                </div>
                <span class="font-bold text-2xl tracking-tight">Simulador CDB</span>
            </div>
            <button onclick="resetAll()" class="text-slate-400 hover:text-white p-2">
                <i class="fas fa-eraser text-2xl"></i>
            </button>
        </div>

        <div class="text-center mt-2">
            <p class="text-emerald-300 text-xs uppercase tracking-widest">Resultado Líquido Estimado</p>
            <h1 id="headerResult" class="text-5xl font-bold text-emerald-400 tracking-tighter">R$ 0,00</h1>
            <p id="headerProfit" class="text-emerald-400 text-base mt-1">+ R$ 0,00 de lucro</p>
        </div>
    </div>

    <div class="p-5 space-y-7">

        <!-- Valores -->
        <div>
            <h3 class="text-xs font-bold text-slate-400 uppercase mb-3 flex items-center gap-2">
                <i class="fas fa-coins text-emerald-500"></i> VALORES
            </h3>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-xs font-medium text-slate-500 block mb-1">Inicial</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">R$</span>
                        <input type="text" id="investmentValue" inputmode="numeric" 
                               class="app-input w-full pl-10 pr-4 py-4 text-xl font-semibold"
                               placeholder="10.000,00" oninput="formatCurrency(this); debounceCalculate()">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-medium text-slate-500 block mb-1">Mensal</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">R$</span>
                        <input type="text" id="monthlyValue" inputmode="numeric"
                               class="app-input w-full pl-10 pr-4 py-4 text-xl font-semibold"
                               placeholder="500,00" oninput="formatCurrency(this); debounceCalculate()">
                    </div>
                </div>
            </div>
        </div>

        <!-- Taxas -->
        <div>
            <h3 class="text-xs font-bold text-slate-400 uppercase mb-3 flex items-center gap-2">
                <i class="fas fa-percent text-emerald-500"></i> TAXAS
            </h3>
            
            <div class="bg-emerald-50 border border-emerald-100 p-5 rounded-3xl mb-5">
                <div class="flex items-center justify-between">
                    <div class="flex-1">
                        <label class="text-xs font-medium text-emerald-700">CDI Atual (a.a.)</label>
                        <input type="text" id="cdiRate" readonly class="bg-transparent text-3xl font-bold text-emerald-900 w-full">
                    </div>
                    <button onclick="fetchCDI()" class="ml-4 w-12 h-12 bg-white rounded-2xl shadow flex items-center justify-center active:scale-95">
                        <i class="fas fa-sync-alt text-emerald-600 text-xl" id="refreshIcon"></i>
                    </button>
                </div>
            </div>

            <div>
                <label class="text-xs font-medium text-slate-500 block mb-2">% do CDI</label>
                <div class="relative">
                    <input type="text" id="cdbPercent" value="100" inputmode="decimal"
                           class="app-input w-full text-center font-bold text-2xl py-5"
                           oninput="debounceCalculate()">
                    <span class="absolute right-6 top-1/2 -translate-y-1/2 text-2xl text-slate-400 font-medium">%</span>
                </div>
            </div>
        </div>

        <!-- Prazo -->
        <div>
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-xs font-bold text-slate-400 uppercase flex items-center gap-2">
                    <i class="fas fa-calendar-alt text-emerald-500"></i> PRAZO
                </h3>
                <label class="flex items-center gap-2 cursor-pointer select-none">
                    <span id="modeLabel" class="text-sm font-medium">Dias Úteis</span>
                    <div class="toggle-switch">
                        <input type="checkbox" id="useBusinessDays" checked onchange="toggleMode()">
                        <span class="toggle-slider"></span>
                    </div>
                </label>
            </div>

            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="text-xs text-slate-500">Meses</label>
                    <input type="number" id="monthsInput" class="app-input w-full py-3 text-center text-lg font-semibold" oninput="handleDateChange()">
                </div>
                <div class="col-span-2">
                    <label class="text-xs text-slate-500">Dias <span id="daysLabelType" class="text-emerald-600">(Úteis)</span></label>
                    <input type="number" id="daysInput" class="app-input w-full py-3 text-center text-lg font-semibold" oninput="handleDateChange()">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 mt-4">
                <div>
                    <label class="text-xs text-slate-500">Início</label>
                    <input type="date" id="startDate" class="app-input w-full py-3" onchange="handleDateChange()">
                </div>
                <div>
                    <label class="text-xs text-slate-500">Fim</label>
                    <input type="date" id="endDate" class="app-input w-full py-3" onchange="handleDateChange()">
                </div>
            </div>
        </div>

        <button onclick="calculate()" 
                class="w-full bg-slate-900 hover:bg-black py-5 rounded-3xl text-white font-bold text-lg shadow-xl active:scale-[0.97] transition-all flex items-center justify-center gap-2">
            <i class="fas fa-calculator"></i> CALCULAR
        </button>

        <!-- Detalhes -->
        <div id="detailsSection" class="details-enter bg-white border border-slate-100 rounded-3xl shadow mt-6">
            <div class="p-6 space-y-6">
                <h4 class="font-bold text-lg">Resultado Detalhado</h4>
                <div class="h-56">
                    <canvas id="resultChart"></canvas>
                </div>

                <div class="space-y-3 text-[15px]">
                    <div class="flex justify-between"><span class="text-slate-500">Total Investido</span><span id="detTotalInvested" class="font-semibold">R$ 0,00</span></div>
                    <div class="flex justify-between"><span class="text-slate-500">Bruto Final</span><span id="detTotalGross" class="font-semibold">R$ 0,00</span></div>
                    <div class="flex justify-between"><span class="text-slate-500">IOF</span><span id="detTotalIOF" class="text-orange-600">- R$ 0,00</span></div>
                    <div class="flex justify-between"><span class="text-slate-500">IR</span><span id="detTotalTax" class="text-red-600">- R$ 0,00</span></div>
                    <div class="flex justify-between border-t border-slate-200 pt-3 font-bold text-lg">
                        <span>Líquido Final</span>
                        <span id="detTotalNet" class="text-emerald-600">R$ 0,00</span>
                    </div>
                </div>

                <!-- Calendário -->
                <div class="grid grid-cols-4 gap-2 text-center text-xs pt-4 border-t">
                    <div class="bg-slate-50 p-3 rounded-2xl">
                        <div id="calBusiness" class="text-2xl font-bold text-emerald-600">0</div>
                        <div class="text-slate-500">Úteis</div>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-2xl">
                        <div id="calWeekend" class="text-2xl font-bold">0</div>
                        <div class="text-slate-500">FDS</div>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-2xl">
                        <div id="calHoliday" class="text-2xl font-bold text-orange-500">0</div>
                        <div class="text-slate-500">Feriados</div>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-2xl">
                        <div id="calTotal" class="text-2xl font-bold text-slate-700">0</div>
                        <div class="text-slate-500">Total</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-2xl shadow-2xl opacity-0 transition-all z-50 flex items-center gap-3">
    <i class="fas fa-check-circle text-emerald-400"></i>
    <span id="toastMessage"></span>
</div>

<script>
    let resultChart = null;
    let debounceTimer = null;

    const FIXED_HOLIDAYS = {'01-01':1,'04-21':1,'05-01':1,'09-07':1,'10-12':1,'11-02':1,'11-15':1,'12-25':1};

    function formatCurrency(input) {
        let val = input.value.replace(/\D/g, '');
        if (!val) { input.value = ''; return; }
        input.value = (parseInt(val)/100).toLocaleString('pt-BR', {minimumFractionDigits: 2});
    }

    function parseMoney(str) {
        if (!str) return 0;
        return parseFloat(str.replace(/\./g,'').replace(',','.')) || 0;
    }

    function formatBRL(v) {
        return v.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        document.getElementById('toastMessage').textContent = msg;
        t.classList.remove('opacity-0');
        setTimeout(() => t.classList.add('opacity-0'), 2800);
    }

    async function fetchCDI() {
        const icon = document.getElementById('refreshIcon');
        icon.classList.add('fa-spin');
        try {
            const res = await fetch('https://api.bcb.gov.br/dados/serie/bcdata.sgs.12/dados/ultimos/1?formato=json');
            const data = await res.json();
            const daily = parseFloat(data[0].valor);
            const annual = (Math.pow(1 + daily/100, 252) - 1) * 100;
            document.getElementById('cdiRate').value = annual.toFixed(2);
            showToast(`CDI atualizado: ${annual.toFixed(2)}%`);
            debounceCalculate();
        } catch(e) {
            document.getElementById('cdiRate').value = '14.40';
        } finally {
            icon.classList.remove('fa-spin');
        }
    }

    function isHoliday(date) {
        const key = date.toISOString().slice(5,10);
        return !!FIXED_HOLIDAYS[key];
    }

    function calculateDateBreakdown(start, end) {
        let current = new Date(start);
        const endDate = new Date(end);
        let totalDays = 0, businessDays = 0, weekends = 0, holidays = 0;

        while (current <= endDate) {
            totalDays++;
            const day = current.getDay();
            if (day === 0 || day === 6) weekends++;
            else if (isHoliday(current)) holidays++;
            else businessDays++;
            current.setDate(current.getDate() + 1);
        }
        return { totalDays: totalDays - 1, businessDays, weekends, holidays };
    }

    function calculate() {
        const principal = parseMoney(document.getElementById('investmentValue').value);
        if (principal <= 0) return showToast("Informe o valor inicial");

        const monthly = parseMoney(document.getElementById('monthlyValue').value);
        const cdi = parseFloat(document.getElementById('cdiRate').value) || 14.4;
        const percent = parseFloat(document.getElementById('cdbPercent').value) || 100;
        const useBusiness = document.getElementById('useBusinessDays').checked;

        const startStr = document.getElementById('startDate').value;
        const endStr = document.getElementById('endDate').value;

        if (!startStr || !endStr) return showToast("Informe as datas");

        const start = new Date(startStr);
        const end = new Date(endStr);
        if (end <= start) return showToast("Data final deve ser maior");

        const breakdown = calculateDateBreakdown(start, end);
        const daysForRate = useBusiness ? breakdown.businessDays : breakdown.totalDays;
        const daysForTax = breakdown.totalDays;

        const dailyCDB = (Math.pow(1 + cdi/100, 1/252) - 1) * (percent / 100);

        // Inicial
        let gross = principal * Math.pow(1 + dailyCDB, daysForRate);
        let profit = gross - principal;

        // IOF
        let iof = 0;
        if (daysForTax < 30 && daysForTax > 0) {
            const iofTable = [96,93,90,86,83,80,76,73,70,66,63,60,56,53,50,46,43,40,36,33,30,26,23,20,16,13,10,6,3];
            iof = profit * (iofTable[daysForTax - 1] / 100);
        }

        const irRate = daysForTax <= 180 ? 22.5 : daysForTax <= 360 ? 20 : daysForTax <= 720 ? 17.5 : 15;
        const ir = (profit - iof) * (irRate / 100);

        let totalInvested = principal;
        let totalGross = gross;
        let totalIOF = iof;
        let totalIR = ir;

        // Aportes mensais
        if (monthly > 0) {
            let current = new Date(start);
            current.setMonth(current.getMonth() + 1);
            while (current < end) {
                const mBD = calculateDateBreakdown(current, end);
                const mDays = useBusiness ? mBD.businessDays : mBD.totalDays;
                const mGross = monthly * Math.pow(1 + dailyCDB, mDays);
                const mProfit = mGross - monthly;

                totalInvested += monthly;
                totalGross += mGross;
                totalIR += mProfit * (irRate / 100);
                current.setMonth(current.getMonth() + 1);
            }
        }

        const totalNet = totalGross - totalIOF - totalIR;
        const netProfit = totalNet - totalInvested;

        // UI
        document.getElementById('headerResult').textContent = formatBRL(totalNet);
        document.getElementById('headerProfit').textContent = `+ ${formatBRL(netProfit)} de lucro`;

        document.getElementById('detTotalInvested').textContent = formatBRL(totalInvested);
        document.getElementById('detTotalGross').textContent = formatBRL(totalGross);
        document.getElementById('detTotalIOF').textContent = `- ${formatBRL(totalIOF)}`;
        document.getElementById('detTotalTax').textContent = `- ${formatBRL(totalIR)}`;
        document.getElementById('detTotalNet').textContent = formatBRL(totalNet);

        // Dias
        document.getElementById('calBusiness').textContent = breakdown.businessDays;
        document.getElementById('calWeekend').textContent = breakdown.weekends;
        document.getElementById('calHoliday').textContent = breakdown.holidays;
        document.getElementById('calTotal').textContent = breakdown.totalDays;

        document.getElementById('detailsSection').classList.add('active');

        // Gráfico
        if (resultChart) resultChart.destroy();
        resultChart = new Chart(document.getElementById('resultChart'), {
            type: 'doughnut',
            data: {
                labels: ['Investido', 'Lucro', 'Impostos'],
                datasets: [{ data: [totalInvested, netProfit, totalIOF + totalIR], backgroundColor: ['#E2E8F0', '#10B981', '#EF4444'] }]
            },
            options: { responsive: true, maintainAspectRatio: false, cutout: '78%' }
        });
    }

    function toggleMode() {
        const checked = document.getElementById('useBusinessDays').checked;
        document.getElementById('modeLabel').textContent = checked ? "Dias Úteis" : "Dias Corridos";
        document.getElementById('daysLabelType').textContent = checked ? "(Úteis)" : "(Corridos)";
        debounceCalculate();
    }

    function handleDateChange() {
        debounceCalculate();
    }

    function debounceCalculate() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(calculate, 400);
    }

    function resetAll() {
        location.reload();
    }

    window.onload = () => {
        const today = new Date();
        document.getElementById('startDate').valueAsDate = today;
        const end = new Date(today); 
        end.setMonth(end.getMonth() + 12);
        document.getElementById('endDate').valueAsDate = end;
        fetchCDI();
    };
</script>
</body>
</html>
